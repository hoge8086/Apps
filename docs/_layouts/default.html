<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ page.title }}</title>

  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #667085;
      --line: #e5e7eb;
      --accent: #2563eb;
      --content-width: 900px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #16191f;
        --text: #f2f4f7;
        --muted: #98a2b3;
        --line: #2a2f38;
        --accent: #7aa2ff;
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-size: 16px;
      line-height: 1.85;
    }

    main {
      width: min(calc(100% - 32px), var(--content-width));
      margin: 48px auto;
      padding: 44px 48px 56px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.05);
    }

    h1, h2, h3 {
      line-height: 1.45;
      letter-spacing: 0.01em;
    }

    h1 {
      margin: 0 0 34px;
      padding-bottom: 18px;
      font-size: clamp(1.9rem, 5vw, 2.35rem);
      font-weight: 750;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      position: relative;
      margin: 42px 0 16px;
      padding: 0 0 10px 16px;
      font-size: 1.35rem;
      font-weight: 700;
      border-bottom: 1px solid var(--line);
    }

    h2::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.2em;
      bottom: calc(10px + 0.2em);
      width: 3px;
      border-radius: 999px;
      background: var(--accent);
    }

    h3 {
      margin: 30px 0 10px;
      font-size: 1.08rem;
      font-weight: 700;
    }

    p { margin: 0 0 18px; }

    ul, ol {
      margin: 0 0 20px;
      padding-left: 1.5em;
    }

    li + li { margin-top: 6px; }

    a {
      color: var(--accent);
      text-decoration: none;
      text-underline-offset: 3px;
    }

    a:hover { text-decoration: underline; }

    hr {
      margin: 40px 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    blockquote {
      margin: 24px 0;
      padding: 2px 0 2px 18px;
      color: var(--muted);
      border-left: 3px solid var(--line);
    }

    code {
      padding: 0.15em 0.35em;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 5px;
      font-size: 0.92em;
    }

    @media (max-width: 640px) {
      body { background: var(--surface); }

      main {
        width: 100%;
        margin: 0;
        padding: 28px 20px 40px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      h1 { margin-bottom: 28px; }
      h2 { margin-top: 34px; }
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
